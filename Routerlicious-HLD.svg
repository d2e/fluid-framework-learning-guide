  <text x="80" y="62" fill="#0f172a" font-size="32" font-weight="700" text-anchor="start">
    <tspan x="80">Routerlicious — High-Level Architecture</tspan>
  </text>
  <text x="82" y="94" fill="#475569" font-size="18" font-weight="700" text-anchor="start">
    <tspan x="82">A guided view: 1. component map  ·  2. operation travel  ·  3. summary travel  ·  4. processing responsibilities</tspan>
  </text>
  <text x="80" y="132" fill="#1d4ed8" font-size="20" font-weight="700" text-anchor="start">
    <tspan x="80">1. Component map</tspan>
  </text>
  <text x="175.0" y="181" fill="#334155" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="175.0">CLIENT / APP LAYER</tspan>
  </text>
  <text x="835.0" y="181" fill="#1d4ed8" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="835.0">ROUTERLICIOUS SERVICE PLANE</tspan>
  </text>
  <text x="1615.0" y="181" fill="#047857" font-size="16" font-weight="700" text-anchor="middle">
    <tspan x="1615.0">DURABLE STORAGE &amp; HISTORY</tspan>
  </text>
  <text x="175.0" y="332" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="175.0">Fluid client apps</tspan>
    <tspan x="175.0" dy="20.8">(browsers / hosts)</tspan>
  </text>
  <text x="175.0" y="527" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="175.0">Tenant token</tspan>
    <tspan x="175.0" dy="20.8">issuer / key holder</tspan>
  </text>
  <text x="485.0" y="334" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="485.0">ALFRED</tspan>
    <tspan x="485.0" dy="20.8">Connection &amp; API gateway</tspan>
    <tspan x="485.0" dy="20.8">WebSocket / REST</tspan>
  </text>
  <text x="772.0" y="336" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="772.0">APACHE KAFKA</tspan>
    <tspan x="772.0" dy="20.8">Unsequenced operations</tspan>
    <tspan x="772.0" dy="20.8">(input topic)</tspan>
  </text>
  <text x="1052.5" y="336" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1052.5">DELI</tspan>
    <tspan x="1052.5" dy="20.8">Orders operations</tspan>
    <tspan x="1052.5" dy="20.8">per document</tspan>
  </text>
  <text x="772.0" y="556" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="772.0">APACHE KAFKA</tspan>
    <tspan x="772.0" dy="20.8">Sequenced operations</tspan>
    <tspan x="772.0" dy="20.8">(output topic)</tspan>
  </text>
  <text x="1053.0" y="556" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1053.0">REDIS</tspan>
    <tspan x="1053.0" dy="20.8">Broadcast / presence</tspan>
    <tspan x="1053.0" dy="20.8">fan-out channel</tspan>
  </text>
  <text x="485.0" y="726" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="485.0">SCRIPTORIUM</tspan>
    <tspan x="485.0" dy="20.8">Persists ordered</tspan>
    <tspan x="485.0" dy="20.8">operation log</tspan>
  </text>
  <text x="772.5" y="726" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="772.5">SCRIBE</tspan>
    <tspan x="772.5" dy="20.8">Processes summary ops</tspan>
    <tspan x="772.5" dy="20.8">&amp; writes snapshots</tspan>
  </text>
  <text x="1520.0" y="340" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1520.0">MONGODB</tspan>
    <tspan x="1520.0" dy="20.8">Ordered operation log</tspan>
  </text>
  <text x="1520.0" y="558" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1520.0">HISTORIAN</tspan>
    <tspan x="1520.0" dy="20.8">Cached snapshot</tspan>
    <tspan x="1520.0" dy="20.8">proxy</tspan>
  </text>
  <text x="1730.0" y="557" fill="#0f172a" font-size="15" font-weight="500" text-anchor="middle">
    <tspan x="1730.0">Git REST / GitHub</tspan>
    <tspan x="1730.0" dy="19.5">Content-addressable</tspan>
    <tspan x="1730.0" dy="19.5">snapshot store</tspan>
  </text>
  <text x="1218.0" y="725" fill="#0f172a" font-size="15" font-weight="500" text-anchor="middle">
    <tspan x="1218.0">COPIER (optional)</tspan>
    <tspan x="1218.0" dy="19.5">Raw-op capture for</tspan>
    <tspan x="1218.0" dy="19.5">test / verification</tspan>
  </text>
  <text x="90" y="921" fill="#475569" font-size="16" font-weight="500" text-anchor="start">
    <tspan x="90">Primary flow: client submits an operation → Kafka → Deli assigns a monotonically increasing per-document sequence number → Kafka → persistence and Redis fan-out.  Summary operations are materialized as Historian snapshots.</tspan>
  </text>
  <text x="90" y="1062" fill="#1d4ed8" font-size="22" font-weight="700" text-anchor="start">
    <tspan x="90">2. Operation travel — submit, sequence, persist, broadcast</tspan>
  </text>
  <text x="200.0" y="1175" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="200.0">1 · FLUID CLIENT</tspan>
    <tspan x="200.0" dy="22.1">Submits an operation</tspan>
  </text>
  <text x="515.0" y="1175" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="515.0">2 · ALFRED</tspan>
    <tspan x="515.0" dy="22.1">Authenticates &amp; accepts</tspan>
  </text>
  <text x="830.0" y="1175" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="830.0">3 · KAFKA</tspan>
    <tspan x="830.0" dy="22.1">Buffers raw operation</tspan>
  </text>
  <text x="1145.0" y="1170" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1145.0">4 · DELI</tspan>
    <tspan x="1145.0" dy="20.8">Assigns monotonically</tspan>
    <tspan x="1145.0" dy="20.8">increasing sequence #</tspan>
  </text>
  <text x="1460.0" y="1175" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="1460.0">5 · KAFKA</tspan>
    <tspan x="1460.0" dy="22.1">Publishes sequenced op</tspan>
  </text>
  <text x="1735.0" y="1174" fill="#0f172a" font-size="16" font-weight="500" text-anchor="middle">
    <tspan x="1735.0">6 · REDIS</tspan>
    <tspan x="1735.0" dy="20.8">Fan-out to clients</tspan>
  </text>
  <text x="95" y="1276" fill="#475569" font-size="16" font-weight="500" text-anchor="start">
    <tspan x="95">Durability branch: the sequenced topic is independently consumed by Scriptorium to retain the ordered operation log in MongoDB.</tspan>
  </text>
  <text x="90" y="1412" fill="#047857" font-size="22" font-weight="700" text-anchor="start">
    <tspan x="90">3. Summary travel — materialize a recoverable document snapshot</tspan>
  </text>
  <text x="252.5" y="1522" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="252.5">1 · CLIENT / RUNTIME</tspan>
    <tspan x="252.5" dy="22.1">Emits summary operation</tspan>
  </text>
  <text x="657.5" y="1522" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="657.5">2 · SEQUENCED KAFKA</tspan>
    <tspan x="657.5" dy="22.1">Delivers summary event</tspan>
  </text>
  <text x="1062.5" y="1522" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="1062.5">3 · SCRIBE</tspan>
    <tspan x="1062.5" dy="22.1">Validates &amp; writes summary</tspan>
  </text>
  <text x="1467.5" y="1522" fill="#0f172a" font-size="17" font-weight="500" text-anchor="middle">
    <tspan x="1467.5">4 · HISTORIAN → GIT</tspan>
    <tspan x="1467.5" dy="22.1">Stores immutable snapshot</tspan>
  </text>
  <text x="130" y="1624" fill="#475569" font-size="16" font-weight="500" text-anchor="start">
    <tspan x="130">Snapshots provide a compact recovery point; ordered operations remain separately available in the operation log for replay and catch-up.</tspan>
  </text>
  <text x="90" y="1762" fill="#6d28d9" font-size="22" font-weight="700" text-anchor="start">
    <tspan x="90">4. Focus components — clear ownership at the processing boundary</tspan>
  </text>
  <text x="155" y="1847" fill="#0f172a" font-size="17" font-weight="500" text-anchor="start">
    <tspan x="155">DELI  ·  ordering authority</tspan>
    <tspan x="155" dy="22.1"></tspan>
    <tspan x="155" dy="22.1">• Consumes unsequenced operations</tspan>
    <tspan x="155" dy="22.1">• Assigns a per-document monotonic sequence number</tspan>
    <tspan x="155" dy="22.1">• Publishes ordered operations and drives broadcast</tspan>
  </text>
  <text x="740" y="1847" fill="#0f172a" font-size="17" font-weight="500" text-anchor="start">
    <tspan x="740">SCRIBE  ·  snapshot materializer</tspan>
    <tspan x="740" dy="22.1"></tspan>
    <tspan x="740" dy="22.1">• Listens for inbound summary operations</tspan>
    <tspan x="740" dy="22.1">• Writes each accepted summary to Historian</tspan>
    <tspan x="740" dy="22.1">• Establishes document recovery checkpoints</tspan>
  </text>
  <text x="1325" y="1847" fill="#0f172a" font-size="17" font-weight="500" text-anchor="start">
    <tspan x="1325">SCRIPTORIUM  ·  operation ledger</tspan>
    <tspan x="1325" dy="22.1"></tspan>
    <tspan x="1325" dy="22.1">• Consumes sequenced operations from Kafka</tspan>
    <tspan x="1325" dy="22.1">• Persists the durable, ordered operation record</tspan>
    <tspan x="1325" dy="22.1">• Supports history lookup and client catch-up</tspan>
  </text>
</svg>